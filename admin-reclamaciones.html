<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Libro de Reclamaciones | Battcakes</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="stylesheet" href="legal.css">
<style>
  .panel{max-width:1100px;margin:40px auto 80px;padding:0 20px}
  .lista{display:grid;gap:12px;margin-top:18px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .item:hover{border-color:var(--accent)}
  .item small{color:var(--muted)}
  .estado{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FFE9C2;color:#7A4B00}
  .estado.atendido{background:#D8F3E3;color:#0B5F32}
  .detalle{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:20px}
  .detalle dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.95rem}
  .detalle dt{font-weight:700;color:var(--muted)}
  .barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  .barra select,.barra input{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  textarea{width:100%;min-height:140px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-top:10px}
</style>
</head>
<body>
<main class="panel">
  <div class="eyebrow">Uso interno</div>
  <h1>Libro de Reclamaciones · Panel</h1>
  <p style="color:var(--muted)">Aquí ves las hojas registradas y respondes a cada una. La respuesta se guarda en la hoja y se envía al correo del consumidor. Recuerda: máximo 15 días hábiles para responder.</p>

  <div class="barra">
    <label for="clave">Clave de acceso</label>
    <input id="clave" type="password" placeholder="ADMIN_KEY" autocomplete="current-password">
    <label for="estado" class="visually-hidden">Estado</label><select id="estado"><option value="pendiente">Pendientes</option><option value="atendido">Atendidas</option><option value="todas">Todas</option></select>
    <button class="btn btn-primary" id="cargar" type="button">Cargar hojas</button>
    <button class="btn btn-outline" id="csv" type="button" title="Descarga todo el libro en CSV (respaldo)">Descargar CSV</button>
    <span id="msg" class="form-status" role="status"></span>
  </div>

  <div class="lista" id="lista"></div>
  <div class="detalle" id="detalle" hidden></div>
</main>
<script>
(function(){
  var API='/api/admin';
  var lista=document.getElementById('lista'),det=document.getElementById('detalle'),msg=document.getElementById('msg');
  var clave=document.getElementById('clave');
  try{clave.value=sessionStorage.getItem('bc-admin-key')||'';}catch(e){}
  function key(){try{sessionStorage.setItem('bc-admin-key',clave.value);}catch(e){}return clave.value;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function f(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('es-PE',{timeZone:'America/Lima'});}catch(e){return iso;}}
  function diasHabiles(iso){var d=new Date(iso),hoy=new Date(),n=0;while(d<hoy){d.setDate(d.getDate()+1);var w=d.getDay();if(w!==0&&w!==6)n++;}return n;}
  var hojas=[];
  function cargar(){
    msg.textContent='Cargando…';msg.className='form-status';
    fetch(API+'?estado='+encodeURIComponent(document.getElementById('estado').value),{headers:{'x-admin-key':key()}})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j.ok)throw new Error(j.error||'Error');
        hojas=j.hojas;msg.textContent=hojas.length+' hoja(s).';msg.className='form-status ok';
        lista.innerHTML=hojas.map(function(h){var dias=h.estado==='pendiente'?diasHabiles(h.creado_en):null;return '<div class="item" data-n="'+esc(h.numero)+'"><div><b>N.° '+esc(h.numero)+'</b> · '+(h.tipo==='queja'?'Queja':'Reclamo')+' · '+esc(h.nombre)+'<br><small>'+esc(f(h.creado_en))+' · '+esc(h.bien_descripcion)+(dias!=null?' · <b>'+dias+' día(s) hábil(es) transcurridos</b>':'')+'</small></div><span class="estado '+esc(h.estado)+'">'+esc(h.estado)+'</span></div>';}).join('')||'<p>No hay hojas en esta categoría.</p>';
      }).catch(function(e){msg.textContent=e.message;msg.className='form-status err';});
  }
  lista.addEventListener('click',function(e){var it=e.target.closest('.item');if(!it)return;var h=hojas.filter(function(x){return x.numero===it.getAttribute('data-n');})[0];if(h)mostrar(h);});
  function mostrar(h){
    det.hidden=false;
    det.innerHTML='<h2 style="font-family:Georgia,serif">Hoja N.° '+esc(h.numero)+' <span class="estado '+esc(h.estado)+'">'+esc(h.estado)+'</span></h2>'+
      '<dl><dt>Registrada</dt><dd>'+esc(f(h.creado_en))+'</dd><dt>Tipo</dt><dd>'+(h.tipo==='queja'?'Queja':'Reclamo')+'</dd><dt>Consumidor</dt><dd>'+esc(h.nombre)+' · '+esc(h.doc_tipo)+' '+esc(h.doc_numero)+(h.menor?' · Apoderado: '+esc(h.apoderado):'')+'</dd><dt>Contacto</dt><dd>'+esc(h.email)+(h.telefono?' · '+esc(h.telefono):'')+'</dd><dt>Prefiere respuesta por</dt><dd>'+(h.canal_respuesta==='whatsapp'?'<b>WhatsApp o llamada</b> (responde también por ese medio)':'Correo electrónico')+'</dd><dt>Domicilio</dt><dd>'+esc(h.domicilio)+'</dd><dt>Bien</dt><dd>'+(h.bien_tipo==='servicio'?'Servicio':'Producto')+' · '+esc(h.bien_descripcion)+(h.monto!=null?' · S/ '+Number(h.monto).toFixed(2):'')+'</dd><dt>Detalle</dt><dd>'+esc(h.detalle).replace(/\n/g,'<br>')+'</dd><dt>Pedido</dt><dd>'+esc(h.pedido).replace(/\n/g,'<br>')+'</dd><dt>Copia enviada</dt><dd>'+(h.email_enviado?'Sí':'No')+'</dd></dl>'+
      '<p style="margin-top:14px"><a href="libro-de-reclamaciones?hoja='+encodeURIComponent(h.numero)+'&codigo='+encodeURIComponent(h.codigo)+'" target="_blank" rel="noopener">Ver hoja como la ve el consumidor</a></p>'+
      '<h3 style="margin-top:18px">Respuesta del proveedor</h3>'+
      (h.respuesta?'<p style="white-space:pre-line;background:var(--accent-soft);padding:12px;border-radius:12px">'+esc(h.respuesta)+'</p><p><small>Respondida el '+esc(f(h.respondido_en))+'</small></p>':'')+
      '<textarea id="resp" placeholder="Escribe la respuesta formal al consumidor: qué se revisó, qué solución se ofrece y los pasos a seguir."></textarea>'+
      '<label class="check" style="margin-top:10px"><input type="checkbox" id="enviar-correo" checked> <span>Enviar la respuesta al correo del consumidor</span></label>'+
      '<div class="barra"><button class="btn btn-primary" id="enviar" type="button">Guardar respuesta</button><span id="rmsg" class="form-status" role="status"></span></div>';
    det.scrollIntoView({behavior:'smooth'});
    document.getElementById('enviar').addEventListener('click',function(){
      var r=document.getElementById('resp').value.trim();var rm=document.getElementById('rmsg');
      if(r.length<10){rm.textContent='Escribe una respuesta más completa.';rm.className='form-status err';return;}
      var mandar=document.getElementById('enviar-correo').checked;
      if(!confirm(mandar?'¿Guardar la respuesta y enviarla a '+h.email+'?':'¿Guardar la respuesta sin enviar correo? (Recuerda responder por el medio elegido por el consumidor)'))return;
      rm.textContent='Enviando…';rm.className='form-status';
      fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-key':key()},body:JSON.stringify({numero:h.numero,respuesta:r,enviar_correo:mandar})})
        .then(function(x){return x.json();})
        .then(function(j){if(!j.ok)throw new Error(j.error||'Error');rm.textContent='Respuesta guardada'+(j.email_enviado?' y enviada por correo.':(mandar?'. (No se envió correo: revisa RESEND_API_KEY.)':'.'));rm.className='form-status ok';cargar();})
        .catch(function(e){rm.textContent=e.message;rm.className='form-status err';});
    });
  }
  document.getElementById('cargar').addEventListener('click',cargar);
  document.getElementById('csv').addEventListener('click',function(){
    fetch(API+'?estado=todas&formato=csv',{headers:{'x-admin-key':key()}}).then(function(r){if(!r.ok)throw new Error('No autorizado o error al exportar.');return r.blob();})
      .then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='libro-de-reclamaciones.csv';document.body.appendChild(a);a.click();a.remove();})
      .catch(function(e){msg.textContent=e.message;msg.className='form-status err';});
  });
  clave.addEventListener('keydown',function(e){if(e.key==='Enter')cargar();});
})();
</script>
</body>
</html>
